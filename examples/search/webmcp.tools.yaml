version: 1
name: search
corpus: ./.sightmap

tools:
  - name: search
    description: Run a search for a query. Navigates to the results page.
    mode: live
    ensure_view: Search
    params:
      - name: query
        type: string
        required: true
        description: What to search for.
    steps:
      - fill:
          query: SearchField
          value: "{{query}}"
      # Clicking the real button runs the search AND navigates to /results.
      - click:
          query: SearchButton

  - name: list_results
    description: List the current search results (id, title, price).
    mode: live
    ensure_view: Results
    steps:
      - collect:
          rows: ResultItem
          fields:
            id: id
            title: title
            price: price

  - name: set_sort
    description: Cycle the result sort order and return the reordered results.
    mode: live
    ensure_view: Results
    steps:
      - click:
          query: SortControl
      # Fold the read into the mutation: return the reordered list directly, so
      # the agent needn't make a second list_results call.
      - collect:
          rows: ResultItem
          fields:
            id: id
            title: title
            price: price

  - name: select_flight
    description: Select a flight by id. Idempotent — selecting the same flight again is a no-op.
    mode: live
    ensure_view: Results
    params:
      - name: flight_id
        type: string
        required: true
        description: The id of the result row to select.
    # Idempotency: if this flight is already the selection, skip.
    guard:
      present:
        query: 'Selection[flight="{{flight_id}}"]'
    steps:
      - click:
          query: 'SelectButton[flight="{{flight_id}}"]'
      - wait_for:
          query: 'Selection[flight="{{flight_id}}"]'
    returns:
      description: The selected flight summary.
      extract:
        query: 'Selection[flight="{{flight_id}}"]'
        property: summary

  - name: book
    description: Book the currently-selected flight. Idempotent — re-booking returns the existing reference.
    mode: live
    ensure_view: Results
    # Idempotency: if a booking confirmation is already showing, skip.
    guard:
      present:
        query: BookingConfirmation
    steps:
      - click:
          query: BookButton
      - wait_for:
          query: BookingConfirmation
    returns:
      description: The booking reference.
      extract:
        query: BookingConfirmation
        property: ref

# Journeys compile into guidance breadcrumbs (search -> list -> select -> book).
journeys:
  - name: book_flow
    description: Search, review, select a flight, and book it.
    steps:
      - search
      - tool: list_results
        reason: read the results the search produced
      - tool: select_flight
        reason: pick a flight by its id
      - tool: book
        reason: book the selected flight
