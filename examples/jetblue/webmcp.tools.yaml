# WebMCP tool layer for jetblue.com, compiled by sightkick against ./.sightmap.
# Built incrementally alongside the corpus: tools reference corpus components by
# name; the generator resolves every compquery to concrete locators and reports
# anything the corpus can't satisfy.
version: 1
name: jetblue
corpus: ./.sightmap

tools:
  # ---- Home: flight search ----
  - name: search_flights
    description: >-
      Search round-trip JetBlue flights by deep-linking to the results page for the
      given airports and dates. Use IATA airport codes and ISO (YYYY-MM-DD) dates.
    mode: live
    ensure_view: Home
    params:
      - name: origin
        type: string
        required: true
        description: Origin IATA airport code, e.g. "JFK".
      - name: destination
        type: string
        required: true
        description: Destination IATA airport code, e.g. "LAX".
      - name: depart_date
        type: string
        required: true
        description: Departure date, ISO format YYYY-MM-DD, e.g. "2026-09-15".
      - name: return_date
        type: string
        required: true
        description: Return date, ISO format YYYY-MM-DD, e.g. "2026-09-22".
    steps:
      # The fare calendar is user-activation-gated (opens only on a trusted press),
      # so the search form can't be driven end-to-end from page JS. The results page
      # accepts the whole query as URL params, so deep-link straight to it — robust
      # and trusted-input-free. (The airport combobox form-fill still works via the
      # runtime's typeInto and is exercised by other flows; this tool prioritizes
      # reliable completion over driving the visible form.)
      - goto:
          url: "https://www.jetblue.com/booking/flights?from={{origin}}&to={{destination}}&depart={{depart_date}}&return={{return_date}}&adults=1&children=0&infants=0&isMultiCity=false&usePoints=false"

  # ---- Select Flights: results ----
  - name: list_flights
    description: List the flight itineraries in the current results — flight number, stops, and duration.
    mode: live
    ensure_view: SelectFlights
    returns:
      description: The current flight itineraries.
      list:
        rows: FlightCard
        fields:
          flight_no: flight_no
          stops: stops
          duration: duration

  - name: list_fares
    description: List every fare option across the current results — cabin and price.
    mode: live
    ensure_view: SelectFlights
    returns:
      description: The fare options offered on the current results.
      list:
        rows: FareOption
        fields:
          cabin: cabin
          price: price

  - name: select_fare
    description: >-
      Select a fare cabin (Main, EvenMore, or Mint) on a specific flight,
      identified by its flight number (e.g. "B6 123"). Scopes to the matching
      flight card, then clicks the requested fare.
    mode: live
    ensure_view: SelectFlights
    params:
      - name: flight
        type: string
        required: true
        description: Flight number to select on, e.g. "B6 123".
      - name: cabin
        type: string
        required: true
        description: Fare cabin — one of "Main", "EvenMore", "Mint".
    steps:
      # flight_no populates at runtime (textContent fallback); label is a direct
      # extract. Both resolve in the compiled tool even though sightmap's offline
      # snapshot shows flight_no blank.
      - click:
          query: 'FlightCard[flight_no*="{{flight}}"] FareOption[label*="{{cabin}}"]'

  - name: sort_results
    description: Open the results sort control to choose an ordering.
    mode: live
    ensure_view: SelectFlights
    steps:
      - click:
          query: SortControl

  # ---- Cart: review + continue to checkout ----
  - name: list_cart
    description: >-
      List the itineraries currently in the cart (both selected legs), read from
      the cart review page.
    mode: live
    ensure_view: Cart
    returns:
      list:
        rows: ItineraryPanel
        fields:
          itinerary: itinerary

  - name: continue_to_checkout
    description: >-
      Proceed from the cart to checkout (passenger details + payment).
    mode: live
    ensure_view: Cart
    steps:
      - click:
          query: ContinueButton

  # ---- Checkout: traveler details ----
  - name: set_passenger
    description: >-
      Fill a traveler-details field by its label (e.g. "First Name",
      "Last Name", "Email address").
    mode: live
    ensure_view: Checkout
    params:
      - name: field
        type: string
        required: true
        description: The field label, e.g. "First Name".
      - name: value
        type: string
        required: true
        description: The value to enter.
    steps:
      - fill:
          query: 'FormField[label*="{{field}}"] FieldInput'
          value: "{{value}}"

  - name: continue_checkout_step
    description: Advance to the next checkout step (Seats & Extras, then payment).
    mode: live
    ensure_view: Checkout
    steps:
      - click:
          query: CheckoutNextButton

# Journeys compile into per-tool guidance breadcrumbs (search -> select -> cart -> checkout).
journeys:
  - name: book_flow
    description: >-
      Search flights, select a fare for each leg, review the cart, and continue
      to checkout.
    steps:
      - search_flights
      - tool: list_flights
        reason: read the itineraries the search produced
      - tool: select_fare
        reason: pick a fare cabin for the depart leg (and again for the return list)
      - tool: list_cart
        reason: review both selected legs before checkout
      - tool: continue_to_checkout
        reason: proceed to passenger details and payment
      - tool: set_passenger
        reason: fill the traveler-details fields (First Name, Last Name, Email, ...)
      - tool: continue_checkout_step
        reason: advance to Seats & Extras, then payment
