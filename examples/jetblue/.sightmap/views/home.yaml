# Home — jetblue.com landing page. Focus: the flight search & booking entry point.
version: 1
views:
  - name: Home
    route: "/"
    url: "https://www.jetblue.com/"
    memory:
      - "The search hero has two parts: a product tablist (Flights / Flights + Hotel / Cruises / Cars / Stays) sitting ABOVE the booking form, and the form itself (`data-fs-element=booker`)."
    components:
      - $ref: MainNav
      - $ref: GlobalNavLink

      # Product selector tabs — sibling ABOVE the booker form, not inside it.
      - name: ProductTabs
        selector: '[role="tablist"]'
        children:
          - name: ProductTab
            selector: '[role="tab"]'
            properties:
              - name: label
                extract: text

      # The flight booking form — the core of the search flow.
      - name: FlightBooker
        selector: '[data-fs-element="booker"]'
        memory:
          - "Backing form posts to /booking; visible controls are react-aria widgets with generated ids, so children anchor on data-fs-element sections and the stable hidden inputs (name=from/to/depart/return)."
        children:
          - name: TripTypeSelector
            selector: '[data-fs-element="trip-type"]'
            properties:
              - name: value
                extract: TripButton.text
            children:
              - name: TripButton
                selector: 'button'
                properties:
                  - name: text
                    extract: text
          # The visible desktop passenger control uses the Tailwind-important
          # class `text-label!`; the plain `text-label` twin is the hidden mobile one.
          - name: PassengerSelector
            selector: 'button.text-label\!'
            properties:
              - name: value
                extract: text
          - name: PointsToggle
            selector: '[data-fs-element="points-toggle"]'
            memory:
              - "Two nodes match (responsive mobile/desktop duplicate); only one is visible."
            properties:
              - name: label
                extract: text

          # Origin / destination row.
          - name: OriginDestination
            selector: '[data-fs-element="route"]'
            memory:
              - "LANDMINE (automation): OriginInput/DestinationInput are react-aria
                comboboxes whose airport-suggestion listbox (AirportPopover ->
                AirportListbox -> AirportOption) renders ONLY after TRUSTED
                keyboard input. Page-JS `fill` (setNativeValue + an 'input'
                event) updates the field text but does NOT open the listbox
                (verified live: 0 options), so a sightkick/WebMCP `search_flights`
                tool typing here fails at the next step with
                'click: no element for [... AirportOption]'. Host-trusted typing
                — `sightmap browser fill 'OriginInput' \"BOS\"` (CDP
                Input.dispatchKeyEvent) — DOES open it (verified: 13 options incl.
                BOS), after which `click 'AirportOption[code=\"BOS\"]'`
                canonicalizes the field to 'Boston, MA (BOS)'. Same trusted-input
                wall as DateField; page JS cannot cross it."
            children:
              - name: OriginInput
                selector: 'div:has(> input[name="from"]) input[role="combobox"]'
              - name: DestinationInput
                selector: 'div:has(> input[name="to"]) input[role="combobox"]'
              - name: SwapButton
                selector: 'button'
                properties:
                  - name: label
                    extract: attr=aria-label

          # Depart / return date row.
          - name: DateRange
            selector: '[data-fs-element="date"]'
            children:
              - name: DateField
                selector: '.group\/text-field'
                memory:
                  - "LANDMINE (automation): the fare calendar opens ONLY on a TRUSTED
                    (user-activation) click on the field. Synthetic main-world clicks
                    — el.click(), a full pointerdown/up sequence, or focus() — do NOT
                    open it (verified live). A sightkick tool running as page JS cannot
                    open it; it needs a host-driven trusted click (agent via CDP
                    Input.dispatchMouseEvent, or an extension via chrome.debugger).
                    'sightmap browser click --x --y' (CDP) opens it fine, so
                    exploration/reproduction is unaffected — this only limits in-page
                    programmatic actuation."
                properties:
                  - name: field
                    extract: DateInput.text
                children:
                  # The field name ("Depart"/"Return") is the input's accessible
                  # name; the floating <label> node itself exposes no AX text.
                  - name: DateInput
                    selector: 'input'
                    properties:
                      - name: text
                        extract: text

          - name: SearchButton
            selector: '[data-fs-element="submit"]'
            properties:
              - name: label
                extract: text

      # Airport autocomplete dropdown (portal-rendered) that opens when an
      # Origin/Destination combobox is focused. Present only while a field is open;
      # the listbox's aria-label ("From"/"To") says which field it belongs to.
      # A search tool selects a suggestion here after filling OriginInput/DestinationInput.
      - name: AirportPopover
        selector: 'div.w-96:has([role="listbox"]:is([aria-label="From"], [aria-label="To"]))'
        memory:
          - "react-aria combobox popover: opens ONLY after TRUSTED keyboard input
            into OriginInput/DestinationInput, not on synthetic input events —
            see the OriginDestination LANDMINE note. Drive it with host-trusted
            `sightmap browser fill '<OriginInput|DestinationInput>' 'BOS'` (which
            opens + filters the list), then `click 'AirportOption[code=\"BOS\"]'`."
        children:
          - name: AirportListbox
            selector: '[role="listbox"]'
            properties:
              - name: field
                extract: attr=aria-label
            children:
              - name: AirportOption
                selector: '[role="option"]'
                properties:
                  # `text` is the offline-visible discriminator ("New York, NY (JFK)").
                  - name: label
                    extract: text
                  # IATA code lives in the <li value="JFK"> attr; live-visible (usable
                  # by a sightkick tool as AirportOption[code=...]) though offline-blind.
                  - name: code
                    extract: attr=value

      # Fare-calendar day cells, shown when a Depart/Return field is opened. Each
      # is a roled button whose accessible name carries the full date (and the
      # day's lowest fare), so it is query-matchable as DayCell[date*="September 15, 2026"].
      - name: DayCell
        selector: 'button.aspect-square'
        memory:
          - "Only present while the date picker is open (opened by a TRUSTED click on a Depart/Return field). It is a horizontal carousel that preloads MANY months (~660 buttons), so this matches far more than the two visible months; filter by the date in the accessible name. Clicking an already-selected Depart field does NOT reopen the picker — open via the empty Return field or re-focus."
          - "The accessible name also includes the day's fare (e.g. '$254'), which is volatile — match on the date substring, not the whole name."
        properties:
          - name: date
            extract: text

      # Help / FAQ search box below the hero.
      - name: HelpSearch
        selector: '[data-fs-element="input-search"]'
        children:
          - name: SubmitSearch
            selector: 'a'
            properties:
              - name: label
                extract: attr=aria-label

      # Promo grid: "Packages, trip deals and more" (6 cards).
      - name: PromoCard
        selector: 'a.rounded-nav-block'
        properties:
          - name: title
            extract: CardTitle.text
        children:
          - name: CardTitle
            selector: 'h3'
            properties:
              - name: text
                extract: text

      # "Explore more flights" CTA below the flight-deals section.
      - name: ExploreMoreFlights
        selector: 'a.rounded-button'
        properties:
          - name: label
            extract: text

      # Standalone personalized promo CTA (credit-card pre-qualify offer).
      - name: PromoCta
        selector: 'a.dy_cta'
        memory:
          - "Dynamic Yield personalization CTA; label/offer rotates per visitor."
        properties:
          - name: label
            extract: text

      # Dynamic Yield personalized hero (TrueBlue points / credit-card offer).
      - name: PromoHero
        selector: '[data-fs-element="dy-container"]'
        memory:
          - "Dynamic Yield personalization slot — its content (offer, CTA labels) rotates per visitor."
        children:
          - name: HeroLink
            selector: 'a'
            properties:
              - name: label
                extract: text
