# Select Flights — the search results / fare-selection page (round-trip Depart leg).
# Reached from Home by submitting the flight search. This is the results view of
# the booking journey: list flights, then select a fare.
version: 1
views:
  - name: SelectFlights
    route: /booking/flights
    url: "https://www.jetblue.com/booking/flights?adults=1&children=0&infants=0&from=JFK&to=LAX&return=2026-09-22&depart=2026-09-15"
    memory:
      - "Separate Angular booking SPA (cb-*/jb-* custom-element tags, `ng-star-inserted`). The marketing site's data-fs-element hooks and MainNav/footer globals do NOT apply here; this app has its own header/footer."
      - "Journey: this is the results view after the Home `search`. A flight card (cb-flight-result-item) is one itinerary; its 3 fare options (jb-card.cb-fare-card = Main / EvenMore / Mint) are the select-fare actions. Selecting a fare advances the booking."
    components:
      # Fare-upsell dialog shown after clicking a fare's Select (e.g. "Get more
      # with Main for +$56"): a reused jb-dialog holding a Base-vs-Cabin compare.
      # Present only DURING fare selection (a transient overlay), so it's in the
      # capture set as a separate modal-open snapshot.
      - name: FareUpsellModal
        selector: '.jb-dialog-content-width'
        memory:
          - "Accept<Base> keeps the cheaper base fare; Select<Cabin> takes the
            upsell. Either COMMITS the depart fare and advances the round-trip to
            the return leg. The X (Close Dialog) dismisses without committing."
        children:
          - name: CloseButton
            selector: 'button[aria-label="Close Dialog"]'
            properties:
              - name: label
                extract: attr=aria-label
          - name: UpsellAction
            selector: 'button:not([aria-label])'
            properties:
              - name: label
                extract: text

      # NOTE: booking-app chrome (SelectedFlightSummary, TripSummary,
      # BookingHeader, BookingFooter, BookingToolbar) is now GLOBAL in
      # components.yaml — shared across every /booking/** view.

      # "Depart" header: route, date, and the Cash/Points price toggle.
      - name: DepartHeader
        selector: 'cb-flight-result-header'
        children:
          - name: CashPointsToggle
            selector: 'cb-dollar-points-toggle jb-segment'
            properties:
              - name: label
                extract: text

      # Alternate-date fare strip (7 nearby days with lowest fares).
      - name: FareDateStrip
        selector: 'cb-alternate-date-offers'
        children:
          - name: FareDateTab
            selector: '.cb-alternate-date-offer__button'
            memory:
              - "The selected day carries a `--active` modifier on the button element itself (not a descendant), so active-state can't be surfaced as a tree-closed property; read it from the DOM class if a tool needs it."
            properties:
              - name: label
                extract: text

      # Sort + filters toolbar.
      - name: ResultsToolbar
        selector: 'cb-filters'
        children:
          - name: SortControl
            selector: 'jb-select'
            properties:
              - name: value
                extract: text
          - name: FilterButton
            selector: 'jb-chip'
            properties:
              - name: label
                extract: text

      # One flight itinerary. `flight_no` (e.g. "B6 123") is the stable id a
      # select tool targets: FlightCard[flight_no="B6 123"] FareOption[cabin="Main"].
      - name: FlightCard
        selector: 'cb-flight-result-item'
        memory:
          - "flight_no/stops/duration come from role-less spans, so sightmap's OFFLINE view (snapshot/coverage/bounds) shows them EMPTY — its `text` extractor returns the a11y name, which is blank for a plain <span>. They DO populate at runtime: sightkick's extractor falls back to innerText/textContent, so FlightCard[flight_no*=\"B6 123\"] resolves in the compiled tool. Verify selection in the tool/runtime, not with `sightmap bounds`. (See sightmap herd: text-extraction parity.)"
        properties:
          # Structured fields, queryable AND usable in returns. Blank in sightmap's
          # offline snapshot (a11y-name-only) but populated at runtime (textContent
          # fallback), so both list_flights returns and FlightCard[flight_no=...]
          # selection work in the compiled tool.
          - name: flight_no
            extract: FlightCode.text
          - name: stops
            extract: Stops.text
          - name: duration
            extract: Duration.text
        children:
          - name: FlightCode
            selector: '.flight-codes'
            properties:
              - name: text
                extract: text
          - name: Stops
            selector: '.flight-panel__stops'
            properties:
              - name: text
                extract: text
          - name: Duration
            selector: '.flight-panel__duration'
            properties:
              - name: text
                extract: text

          # The 3 fare options per itinerary — each is a clickable select-fare card.
          - name: FareOption
            selector: 'jb-card.cb-fare-card'
            properties:
              # Direct discriminator for selection queries, e.g. FareOption[label*="Mint"].
              - name: label
                extract: text
              - name: cabin
                extract: Cabin.text
              - name: price
                extract: Price.text
            children:
              - name: Cabin
                selector: '.body'
                properties:
                  - name: text
                    extract: text
              - name: Price
                selector: '.cb-bundle-price__price'
                properties:
                  - name: text
                    extract: text

          # Per-card actions.
          - name: CardAction
            selector: 'button.action-button'
            properties:
              - name: label
                extract: text

      # "More flights" / pagination affordance at the bottom of the list.
      - name: MoreFlights
        selector: 'cb-more-flights'
        properties:
          - name: label
            extract: text


      # Focusable page heading ("Select Flights").
      - name: PageHeading
        selector: '#first-focus-fares-heading'
        properties:
          - name: text
            extract: text

      # "BlueHouse lounge" perks banner above the results.
      - name: PerksBanner
        selector: 'cb-perks-banner'
        properties:
          - name: text
            extract: text

      # Barclays JetBlue-card promo interspersed in the results.
      - name: CardPromo
        selector: 'jb-card-promotion-flight-results'
        properties:
          - name: text
            extract: text

      # Vacations cross-sell promo ("Up to 50% off ... flights").
      - name: VacationsCrossSell
        selector: '#vacations-cross-sell'
        properties:
          - name: label
            extract: text

      # Inline fine-print links ("bag fees", "taxes & fees") in the legal disclaimer.
      - name: FinePrintLink
        selector: 'a.royal-blue.underline'
        properties:
          - name: label
            extract: text


