version: 1
views:
  - name: Checkout
    route: /booking/checkout
    url: "https://www.jetblue.com/booking/checkout"
    memory:
      - "Multi-step checkout (jb-checkout): '1. Traveler Details' (passenger form),
        '2. Seats & Extras', then payment. jb-sign-in offers to log in; cb-price-summary
        is the running total sidebar. Reached from the Cart via Continue to checkout."
    components:
      # Traveler-details form: labelled field containers (Title, First/Middle/Last
      # name, email, DOB, address, ...) across the Personal/Contact/Additional
      # sections. One component per field, discriminated by its label.
      - name: FormField
        selector: 'jb-form-field-container'
        properties:
          - name: label
            extract: FieldLabel.text
        children:
          - name: FieldLabel
            selector: 'label'
            properties:
              - name: text
                extract: text
          - name: FieldInput
            selector: 'input, select'
            properties:
              - name: value
                extract: attr=value

      # Sign-in prompt shown above the guest form (jb-sign-in).
      - name: SignInPanel
        selector: 'jb-sign-in'
        properties:
          - name: text
            extract: text

      # Primary step CTA ("Next: Seats & Extras" / "Continue to checkout").
      - name: CheckoutNextButton
        selector: 'jb-checkout button.jb-button-primary'
        properties:
          - name: label
            extract: text

      # Traveler card header (name/DOB summary text block).
      - name: TravelerCard
        selector: '.card-traveler-details'
        properties:
          - name: text
            extract: text

      # Optional-field reveal toggles ("Add suffix", "I have a frequent flyer
      # number", "I require wheelchair assistance", ...).
      - name: OptionalFieldToggle
        selector: 'jb-action'
        properties:
          - name: label
            extract: text

      # Collapsible sections (Emergency Contact, the per-traveler accordion).
      - name: ExpansionPanelHeader
        selector: 'jb-expansion-panel-header'
        properties:
          - name: label
            extract: text

      # Running price-summary sidebar (fare restrictions / taxes / currency links
      # live inside; matches 2 responsive copies, one visible). Shared with Cart.
      - name: PriceSummary
        selector: 'cb-price-summary'
        properties:
          - name: total
            extract: text

      # Inline policy / fine-print links in the checkout body.
      - name: PolicyLink
        selector: 'jb-checkout a.royal-blue.no-underline'
        properties:
          - name: label
            extract: text

      # Focusable page heading ("Checkout").
      - name: CheckoutHeading
        selector: '#first-focus-checkout-heading'
        properties:
          - name: text
            extract: text

      # Screen-reader step heading ("1. Traveler Details").
      - name: StepHeading
        selector: '#travelerDetails'
        properties:
          - name: text
            extract: text

      # Date-of-birth fieldset (day / month / year controls).
      - name: DateOfBirthGroup
        selector: 'jb-personal-info fieldset'
        properties:
          - name: label
            extract: text

      # Expanded content of a collapsible section (its inner rows).
      - name: ExpansionPanelContent
        selector: '.jb-expansion-panel-content'
