# .sightmap/components.yaml — global components, matched on every view.
# jetblue.com exposes stable `data-fs-element` attributes as its primary selector
# hooks. react-aria `_R_...` ids and Tailwind utility classes are NOT stable and
# must be avoided as anchors.
version: 1

memory:
  - "Primary selector hook across the whole site is the `data-fs-element` attribute. Prefer it over classes/ids."
  - "The DOM carries responsive mobile/desktop duplicates (Tailwind `md:hidden` / `max-md:hidden`); some components legitimately match 2 nodes with only one visible at a time."
  - "The header nav, the top global bar, and the footer appear on every marketing page."
  - "TWO APPS under one domain: the marketing site (data-fs-element hooks, Next.js) covers /, and a separate Angular booking SPA (cb-*/jb-* tags) covers /booking/**. Globals here span BOTH apps: the marketing chrome (PageMain, nav, footer...) 0-matches /booking/**, and the booking chrome (BookingHeader/Footer/Toolbar, TripSummary, SelectedFlightSummary) 0-matches /. Each set legitimately 0-matches the OTHER app's views — the two-app-under-one-domain tradeoff, expected, not a broken selector. (The multi-view/route-scoped-globals model that would remove this noise is tracked upstream as sightmap SEP-0010-adjacent work.)"

components:
  # Main content landmark (#main). Labeling it scopes the page's focusable
  # scroll-anchor sections and the product tabpanel under a named container.
  - name: PageMain
    selector: '#main'

  # Next.js client-route announcer live region (accessibility), present sitewide.
  - name: RouteAnnouncer
    selector: '#__next-route-announcer__'
    memory:
      - "Next.js router live region — framework a11y plumbing, not app UI."

  # Accessibility skip link (href="#main"), first focusable element on every page.
  - name: SkipToContent
    selector: 'a.sr-only'
    properties:
      - name: label
        extract: text

  # Third-party Qualtrics feedback widget, injected on every page.
  - name: FeedbackButton
    selector: '#QSIFeedbackButton-btn'
    memory:
      - "Third-party Qualtrics (QSI) widget — not part of the JetBlue app."
    properties:
      - name: label
        extract: text

  # Brand-switcher logo row (Flights / Explore packages / Explore trip deals /
  # Points & Perks / Credit Cards) shown near the footer.
  - name: BrandSwitcherLink
    selector: 'a.h-24'
    properties:
      - name: label
        extract: text

  # Top utility bar: JetBlue / JetBlue Vacations / TrueBlue Travel brand switcher.
  - name: GlobalNavLink
    selector: '[data-fs-element="global-nav-link"]'
    properties:
      - name: label
        extract: text

  # Primary header navigation.
  - name: MainNav
    selector: '[data-fs-element="main-nav"]'
    children:
      - name: Logo
        selector: '[data-fs-element="main-nav-logo"]'
        properties:
          - name: label
            extract: text
      - name: NavMenuButton
        selector: '[data-fs-element="main-nav-menu-button"]'
        properties:
          - name: label
            extract: text
      - name: SignInButton
        selector: '[data-fs-element="main-nav-menu-button-user-unauthenticated"]'
        properties:
          - name: label
            extract: text
      - name: Hamburger
        selector: '[data-fs-element="main-nav-hamburger"]'
        properties:
          - name: label
            extract: attr=aria-label

  # Footer (global). Modeled as leaf links + menu buttons.
  - name: FooterMenuButton
    selector: '[data-fs-element="footer-menu-button"]'
    properties:
      - name: label
        extract: text

  - name: FooterLink
    selector: '[data-fs-element="footer-link-set-link"]'
    properties:
      - name: label
        extract: text

  - name: FooterSocialLink
    selector: '[data-fs-element="footer-social-media-link"]'
    properties:
      - name: label
        extract: attr=aria-label

  - name: FooterHelpLink
    selector: '[data-fs-element="footer-help-link"]'
    properties:
      - name: label
        extract: text

  # "Join our email list" / "Download the JetBlue app" promo links in the footer.
  - name: FooterPromoLink
    selector: '[data-fs-element="footer-social-link"]'
    properties:
      - name: label
        extract: text

  - name: LanguageSelector
    selector: '[data-fs-element="footer-language-selector"]'
    properties:
      - name: label
        extract: text

  # ---- Booking-app chrome (Angular SPA at /booking/**) --------------------
  # Shared across every /booking/** view (SelectFlights, Cart, Checkout, ...).
  # These 0-match the marketing views, mirroring how the marketing globals above
  # 0-match /booking/**.
  - name: BookingHeader
    selector: 'cb-header'
    children:
      - name: SkipLink
        selector: 'a.skip-to-content'
        properties:
          - name: label
            extract: text
      - name: Logo
        selector: 'cb-header-icon a'
        properties:
          - name: label
            extract: attr=aria-label
      - name: SignIn
        selector: 'cb-header-login button'
        properties:
          - name: label
            extract: text

  # Booking-app top nav bar (distinct from the results filter toolbar).
  - name: BookingToolbar
    selector: 'jb-toolbar'

  - name: BookingFooter
    selector: 'jb-footer'
    children:
      - name: FooterLink
        selector: 'a.royal-blue'
        properties:
          - name: label
            extract: text
      - name: LanguageSelect
        selector: 'jb-select'
        properties:
          - name: label
            extract: text

  # Editable trip summary in the booking header (route / dates / travelers).
  - name: TripSummary
    selector: 'cb-mini-booker'
    properties:
      - name: summary
        extract: text

  # Collapsed summary of an already-committed leg (return list + cart), with a
  # Change button that reopens that leg's flight list.
  - name: SelectedFlightSummary
    selector: '.flight-selection-item'
    properties:
      - name: summary
        extract: text
    children:
      - name: ChangeButton
        selector: '.flight-selection-item__change-button'
        properties:
          - name: label
            extract: text
