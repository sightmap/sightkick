version: 1
name: burrito
# sightkick as an external consumer of a third-party app's sightmap corpus.
# Resolves to potemkin/village/burrito/.sightmap (sibling repo under subtext/).
corpus: ../../../potemkin/village/burrito/.sightmap

# A same-document SPA ordering flow: Menu (/) -> Item detail (/items/**) ->
# Cart (/cart) -> Checkout (/checkout) -> Confirmation (/confirmation). Tools are
# atomic + view-scoped; the journey compiles into guidance breadcrumbs.
tools:
  - name: list_menu
    description: List the menu items (name + price).
    mode: live
    ensure_view: MenuView
    steps:
      - collect:
          component: MenuCard
          fields:
            item:
              property: itemName
            price:
              property: price

  - name: open_item
    description: Open a menu item's detail page to customize it. Navigates to the item view.
    mode: live
    ensure_view: MenuView
    params:
      - name: item
        type: string
        required: true
        description: The exact menu item name (see list_menu).
    steps:
      - click:
          component: MenuCard
          where:
            itemName: "{{item}}"

  - name: choose_option
    description: >-
      Pick a customization option within a group on the item detail page
      (e.g. group "Protein", option "steak"). Scoped by group so repeated labels
      like "none" are unambiguous.
    mode: live
    ensure_view: ItemDetailView
    params:
      - name: group
        type: string
        required: true
        description: The option group (Protein, Rice, Beans, Salsa, Extras).
      - name: option
        type: string
        required: true
        description: The option label within that group (e.g. steak, white, none, guacamole).
    steps:
      # A compquery path scopes the button to its group. Labels are matched
      # case-insensitively (i): sightmap snapshots show CSS text-transformed
      # values (e.g. "Protein"), while the DOM's textContent is "protein".
      - click:
          query: 'OptionGroup[name="{{group}}" i] OptionButton[label="{{option}}" i]'

  - name: add_to_cart
    description: Add the customized item to the cart. Navigates to the cart.
    mode: live
    ensure_view: ItemDetailView
    steps:
      - click:
          component: AddToCartButton

  - name: set_field
    description: >-
      Fill a checkout field by its label. The checkout form is pre-filled, so
      this is only needed to change a value.
    mode: live
    ensure_view: CheckoutView
    params:
      - name: field
        type: string
        required: true
        description: The field label (Street, City, State, ZIP, Card number, Expiry, CVC).
      - name: value
        type: string
        required: true
        description: The value to enter.
    steps:
      # Scope the input to the labelled TextField (delivery fields have no
      # distinctive own-property, so the parent's label is what disambiguates).
      - fill:
          query: 'TextField[label="{{field}}" i] FieldInput'
          value: "{{value}}"

  - name: view_cart
    description: List the items currently in the cart.
    mode: live
    ensure_view: CartView
    steps:
      - collect:
          component: CartLine
          fields:
            name:
              property: name

  - name: go_to_checkout
    description: Proceed from the cart to checkout. Navigates to the checkout page.
    mode: live
    ensure_view: CartView
    steps:
      - click:
          component: SummaryCta

  - name: place_order
    description: >-
      Place the order from checkout (the form is pre-filled). Navigates to the
      confirmation page and returns the order id.
    mode: live
    ensure_view: CheckoutView
    steps:
      - click:
          component: SummaryCta
      - wait_for:
          component: OrderId
    returns:
      description: The order confirmation id.
      extract:
        component: OrderId
        property: id

# The ordering journey -> per-tool guidance breadcrumbs.
journeys:
  - name: order_flow
    description: Browse the menu, customize an item, and check out.
    steps:
      - tool: list_menu
        reason: see what's available
      - tool: open_item
        reason: open an item to customize it
      - tool: choose_option
        reason: customize the item
      - tool: add_to_cart
        reason: add the customized item to the cart
      - tool: view_cart
        reason: review the cart
      - tool: go_to_checkout
        reason: proceed to checkout
      - tool: place_order
        reason: place the order
