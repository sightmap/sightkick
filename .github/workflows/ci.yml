name: ci

# Per-PR verification (the release workflow only runs post-merge on main). Two
# path-independent jobs: the Go generator (build + embedded-skill drift-check +
# tests) and the TypeScript runtime (typecheck + tests).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: generator/go.sum

      - name: Build, drift-check, test
        working-directory: generator
        run: |
          go build ./...
          go generate ./skills/...
          # go generate rewrites the embedded copy (generator/skills = ./skills here);
          # any diff means it drifted from the canonical <repo>/skills source.
          git diff --exit-code -- skills || {
            echo "::error::embedded skills are out of sync — run 'go generate ./skills/...' and commit"; exit 1;
          }
          go generate ./webmcpinspector/...
          # same guard for the embedded WebMCP inspector, generated from the
          # canonical <repo>/vendor/webmcp-tool/unpacked copy.
          git diff --exit-code -- webmcpinspector || {
            echo "::error::embedded WebMCP inspector is out of sync — run 'go generate ./webmcpinspector/...' and commit"; exit 1;
          }
          go test ./...
          # The e2e test needs a browser and a served app, so it can't run
          # here — but vet still compiles it, so it can't rot unnoticed.
          go vet -tags e2e ./...

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.17 (the pinned packageManager) needs Node >= 22.13.
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: generator/go.sum

      - run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test
        run: |
          pnpm -r build
          pnpm -r typecheck
          pnpm -r test

      # pnpm -r build produced packages/runtime/dist/sightkick-runtime.js; the
      # copy embedded in the Go binary (generator/runtimebundle) must match it.
      - name: Embedded runtime bundle in sync
        working-directory: generator
        run: |
          go generate ./runtimebundle/...
          git diff --exit-code -- runtimebundle || {
            echo "::error::embedded runtime bundle is stale — rebuild the runtime and run 'go generate ./runtimebundle/...'"; exit 1;
          }
